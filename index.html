<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalkulátor ceny elektřiny</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-3">

  <div class="container" style="max-width: 500px;">
    <h2 class="text-center mb-4">Kalkulátor ceny elektřiny</h2>

    <form id="elForm">
      <div class="mb-2">
        <label>Spotřeba (kWh/den):</label>
        <input type="number" id="spotreba" class="form-control" required>
      </div>

      <div class="mb-2">
        <label>Cena za 1 kWh (Kč):</label>
        <input type="number" id="cena" class="form-control" value="6" required>
      </div>

      <div class="mb-2">
        <label>Počet dní:</label>
        <input type="number" id="dny" class="form-control" value="30" required>
      </div>

      <div class="mb-2">
        <label>Název spotřebiče:</label>
        <input type="text" id="nazev" class="form-control" placeholder="např. Lednička">
      </div>

      <button type="submit" class="btn btn-primary mt-2">Spočítat</button>
    </form>

    <h4 class="mt-4">Výsledky</h4>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Spotřebič</th>
          <th>Spotřeba</th>
          <th>Cena/kWh</th>
          <th>Dny</th>
          <th>Celkem</th>
        </tr>
      </thead>
      <tbody id="vysledky"></tbody>
    </table>

    <p id="součet" class="fw-bold"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
